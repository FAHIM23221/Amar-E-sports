name: Build APK

on:
  push:
    paths:
      - "update.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip update.zip
        run: |
          shopt -s dotglob
          rm -rf project && mkdir project
          unzip -o update.zip -d project
          inner=$(ls project)
          if [ "$(echo "$inner" | wc -l)" -eq 1 ] && [ -d "project/$inner" ] && [ "$inner" != "app" ]; then
            mv "project/$inner"/* project/
            rmdir "project/$inner"
          fi
          ls -la project project/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Android scaffold
        working-directory: project/app
        run: |
          flutter create --platforms=android --org com.amaresports --project-name amar_esports ../_scaffold
          cp -r ../_scaffold/android ./android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Amar Esports"#' "$M"
          grep -n "INTERNET\|android:label" "$M"

      - name: Build APK
        working-directory: project/app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-esports-apk
          path: project/app/build/app/outputs/flutter-apk/app-release.apk
