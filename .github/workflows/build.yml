name: Build APKs

on:
  push:
    paths:
      - "update.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip update.zip
        run: |
          shopt -s dotglob
          rm -rf project && mkdir project
          unzip -o update.zip -d project
          ls -la project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build user and admin apps
        run: |
          set -e
          for APP in app admin_app; do
            if [ -f "project/$APP/pubspec.yaml" ]; then
              NAME=$(grep '^name:' "project/$APP/pubspec.yaml" | awk '{print $2}')
              if [ "$APP" = "admin_app" ]; then LABEL="Amar Esports Admin"; else LABEL="Amar Esports"; fi
              echo "=== Building $APP ($NAME) ==="
              cd "project/$APP"
              flutter create --platforms=android --org com.amaresports --project-name "$NAME" "../_scaffold_$APP"
              cp -r "../_scaffold_$APP/android" ./android
              if [ -d android_icons ]; then cp -r android_icons/. android/app/src/main/res/; fi
              M=android/app/src/main/AndroidManifest.xml
              sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
              sed -i "s#android:label=\"[^\"]*\"#android:label=\"$LABEL\"#" "$M"
              flutter pub get
              flutter build apk --release
              cd ../..
            fi
          done

      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-esports-user-apk
          path: project/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-esports-admin-apk
          path: project/admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
