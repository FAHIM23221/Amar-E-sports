name: Build and Deploy

on:
  push:
    paths:
      - "update.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip update.zip
        run: |
          shopt -s dotglob
          rm -rf project && mkdir project
          unzip -o update.zip -d project
          inner=$(ls project)
          if [ "$(echo "$inner" | wc -l)" -eq 1 ] && [ -d "project/$inner" ]; then
            mv "project/$inner"/* project/
            rmdir "project/$inner"
          fi
          ls -la project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firebase backend
        if: hashFiles('project/firebase.json') != ''
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd project/functions && npm install && cd ..
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,functions --project amaresports-25028 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - uses: actions/setup-java@v4
        if: hashFiles('project/app/pubspec.yaml') != ''
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: hashFiles('project/app/pubspec.yaml') != ''
        with:
          channel: stable

      - name: Build Android APK
        if: hashFiles('project/app/pubspec.yaml') != ''
        working-directory: project/app
        run: |
          flutter pub get
          flutter build apk --release
